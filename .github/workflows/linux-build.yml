name: Linux Build

# 手动触发：构建 Linux 单文件版（浏览器模式），可顺手附加到已有的 Release。
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "要附加到的 Release tag（如 v1.6.0）；留空只上传 artifact"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # 原生窗口：pywebview 的 Qt 后端（PyQt5 + QtWebEngine），依赖全部来自 pip
          pip install "nicegui>=3.7,<4.0" "fastapi>=0.141,<1.0" "uvicorn>=0.44" \
            "keyring>=25.7" "pyinstaller>=6.0" "pywebview>=5.0" \
            "PyQt5==5.15.11" "PyQtWebEngine==5.15.7" "qtpy>=2.4"

      - name: Fetch frpc (linux amd64)
        run: |
          curl -fL -o frp.tar.gz \
            https://github.com/fatedier/frp/releases/download/v0.72.0/frp_0.72.0_linux_amd64.tar.gz
          tar -xzf frp.tar.gz
          cp frp_0.72.0_linux_amd64/frpc ./frpc
          chmod +x frpc

      - name: Build
        run: python build.py

      - name: Show result
        run: |
          VERSION=$(python -c "from engine.version import APP_VERSION; print(APP_VERSION)")
          ls -lh "dist/${VERSION}"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: AMinecraftLauncher-linux-x86_64
          path: dist/*/A Minecraft Launcher

      - name: Attach to release
        if: inputs.tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(python -c "from engine.version import APP_VERSION; print(APP_VERSION)")
          gh release upload "${{ inputs.tag }}" \
            "dist/${VERSION}/A Minecraft Launcher#AMinecraftLauncher-${VERSION}-linux-x86_64" \
            --clobber
